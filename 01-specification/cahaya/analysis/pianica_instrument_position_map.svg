<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: #fff;">
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="500">Pianica harmonic character: position among wind instruments</text>
  
  <!-- Axes -->
  <text x="400" y="480" text-anchor="middle" font-size="12" fill="#888">harmonic richness (visible harmonics count)</text>
  <text x="25" y="260" text-anchor="middle" font-size="12" fill="#888" transform="rotate(-90 25 260)">2nd harmonic / fundamental ratio (dB)</text>
  <line x1="80" y1="50" x2="80" y2="450" stroke="#ddd" stroke-width="0.5"/>
  <line x1="80" y1="450" x2="750" y2="450" stroke="#ddd" stroke-width="0.5"/>
  
  <!-- Y axis: -20 to +5 dB (2nd/1st ratio) -->
  <text x="75" y="90" text-anchor="end" font-size="10" fill="#aaa">+5</text>
  <text x="75" y="170" text-anchor="end" font-size="10" fill="#aaa">0</text>
  <text x="75" y="250" text-anchor="end" font-size="10" fill="#aaa">-5</text>
  <text x="75" y="330" text-anchor="end" font-size="10" fill="#aaa">-10</text>
  <text x="75" y="410" text-anchor="end" font-size="10" fill="#aaa">-15</text>
  <line x1="80" y1="170" x2="750" y2="170" stroke="#eee" stroke-width="0.5" stroke-dasharray="4"/>
  
  <!-- X axis: 2 to 12 harmonics -->
  <text x="160" y="465" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="290" y="465" text-anchor="middle" font-size="10" fill="#aaa">5</text>
  <text x="420" y="465" text-anchor="middle" font-size="10" fill="#aaa">7</text>
  <text x="550" y="465" text-anchor="middle" font-size="10" fill="#aaa">9</text>
  <text x="680" y="465" text-anchor="middle" font-size="10" fill="#aaa">11</text>
  
  <!-- Flute: 4 harmonics, 2nd=-6dB -->
  <circle cx="225" cy="266" r="14" fill="#1D9E75" opacity="0.2" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="225" y="270" text-anchor="middle" font-size="9" fill="#085041">Flute</text>
  
  <!-- Sheng: 4 harmonics, 2nd=-8dB -->
  <circle cx="225" cy="298" r="14" fill="#7F77DD" opacity="0.2" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="225" y="302" text-anchor="middle" font-size="9" fill="#3C3489">Sheng</text>

  <!-- Clarinet: 7 odd only, 2nd=-12dB -->
  <circle cx="420" cy="362" r="14" fill="#888" opacity="0.2" stroke="#888" stroke-width="1.5"/>
  <text x="420" y="366" text-anchor="middle" font-size="9" fill="#444">Clarinet</text>
  
  <!-- Sax: 6 harmonics, 2nd=-3dB -->
  <circle cx="355" cy="218" r="14" fill="#BA7517" opacity="0.2" stroke="#BA7517" stroke-width="1.5"/>
  <text x="355" y="222" text-anchor="middle" font-size="9" fill="#633806">Sax</text>
  
  <!-- Oboe: 8 harmonics, 2nd=+3dB -->
  <circle cx="485" cy="122" r="14" fill="#E24B4A" opacity="0.2" stroke="#E24B4A" stroke-width="1.5"/>
  <text x="485" y="126" text-anchor="middle" font-size="9" fill="#791F1F">Oboe</text>
  
  <!-- Trumpet: 8 harmonics, 2nd=+2dB -->
  <circle cx="485" cy="138" r="14" fill="#D85A30" opacity="0.2" stroke="#D85A30" stroke-width="1.5"/>
  <text x="485" y="142" text-anchor="middle" font-size="9" fill="#712B13">Trumpet</text>
  
  <!-- Accordion: 8 harmonics, 2nd=-2dB -->
  <circle cx="485" cy="202" r="14" fill="#639922" opacity="0.2" stroke="#639922" stroke-width="1.5"/>
  <text x="485" y="206" text-anchor="middle" font-size="9" fill="#27500A">Accordion</text>
  
  <!-- Harmonium: 6 harmonics, 2nd=-2dB -->
  <circle cx="355" cy="202" r="14" fill="#5DCAA5" opacity="0.2" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="355" y="206" text-anchor="middle" font-size="8" fill="#04342C">Harmonium</text>
  
  <!-- PIANICA points (3 registers) -->
  <!-- C6: 3 harmonics, 2nd=-16dB -->
  <circle cx="160" cy="426" r="10" fill="#378ADD" opacity="0.4" stroke="#378ADD" stroke-width="2"/>
  <text x="160" y="430" text-anchor="middle" font-size="8" font-weight="500" fill="#042C53">C6</text>
  
  <!-- C4: 7 harmonics, 2nd=+2dB -->
  <circle cx="420" cy="138" r="10" fill="#378ADD" opacity="0.4" stroke="#378ADD" stroke-width="2"/>
  <text x="420" y="142" text-anchor="middle" font-size="8" font-weight="500" fill="#042C53">C4</text>
  
  <!-- F3: 10 harmonics, 2nd=-2dB -->
  <circle cx="615" cy="202" r="10" fill="#378ADD" opacity="0.4" stroke="#378ADD" stroke-width="2"/>
  <text x="615" y="206" text-anchor="middle" font-size="8" font-weight="500" fill="#042C53">F3</text>
  
  <!-- E4: 8 harmonics, 2nd=-3dB -->
  <circle cx="485" cy="218" r="10" fill="#378ADD" opacity="0.4" stroke="#378ADD" stroke-width="2"/>
  <text x="485" y="222" text-anchor="middle" font-size="8" font-weight="500" fill="#042C53">E4</text>
  
  <!-- Arrow showing pianica range -->
  <line x1="170" y1="420" x2="605" y2="205" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#378ADD"/></marker></defs>
  <text x="350" y="305" text-anchor="middle" font-size="11" fill="#378ADD" font-weight="500">Pianica range</text>
  <text x="350" y="320" text-anchor="middle" font-size="9" fill="#378ADD">(high -> low register)</text>
</svg>
