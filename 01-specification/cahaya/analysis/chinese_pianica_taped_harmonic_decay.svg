<svg viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: #fff;">
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="500">Harmonic decay slope -- Chinese pianica + tape</text>
  
  <!-- Axes -->
  <line x1="80" y1="50" x2="80" y2="380" stroke="#ccc" stroke-width="0.5"/>
  <line x1="80" y1="380" x2="660" y2="380" stroke="#ccc" stroke-width="0.5"/>
  
  <!-- Y axis labels (dB) -->
  <text x="75" y="72" text-anchor="end" font-size="11" fill="#888">+5</text>
  <text x="75" y="137" text-anchor="end" font-size="11" fill="#888">0</text>
  <text x="75" y="202" text-anchor="end" font-size="11" fill="#888">-5</text>
  <text x="75" y="267" text-anchor="end" font-size="11" fill="#888">-10</text>
  <text x="75" y="332" text-anchor="end" font-size="11" fill="#888">-15</text>
  <text x="75" y="380" text-anchor="end" font-size="11" fill="#888">-20</text>
  <text x="30" y="220" text-anchor="middle" font-size="12" fill="#888" transform="rotate(-90 30 220)">relative dB</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="137" x2="660" y2="137" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="202" x2="660" y2="202" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="267" x2="660" y2="267" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="332" x2="660" y2="332" stroke="#eee" stroke-width="0.5"/>
  
  <!-- X axis labels -->
  <text x="80" y="400" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="145" y="400" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="209" y="400" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="274" y="400" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="338" y="400" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="403" y="400" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="467" y="400" text-anchor="middle" font-size="11" fill="#888">7</text>
  <text x="532" y="400" text-anchor="middle" font-size="11" fill="#888">8</text>
  <text x="596" y="400" text-anchor="middle" font-size="11" fill="#888">9</text>
  <text x="660" y="400" text-anchor="middle" font-size="11" fill="#888">10</text>
  <text x="370" y="425" text-anchor="middle" font-size="12" fill="#888">harmonic number (n)</text>
  
  <!-- F3: 0,-2,-4,-6,-8,-5,-12,-10,-14,-18 -->
  <polyline points="80,137 145,163 209,189 274,215 338,241 403,202 467,293 532,267 596,319 660,371" fill="none" stroke="#E24B4A" stroke-width="2"/>
  <circle cx="80" cy="137" r="3" fill="#E24B4A"/><circle cx="145" cy="163" r="3" fill="#E24B4A"/><circle cx="209" cy="189" r="3" fill="#E24B4A"/><circle cx="274" cy="215" r="3" fill="#E24B4A"/><circle cx="338" cy="241" r="3" fill="#E24B4A"/><circle cx="403" cy="202" r="3" fill="#E24B4A"/><circle cx="467" cy="293" r="3" fill="#E24B4A"/><circle cx="532" cy="267" r="3" fill="#E24B4A"/><circle cx="596" cy="319" r="3" fill="#E24B4A"/><circle cx="660" cy="371" r="3" fill="#E24B4A"/>
  
  <!-- C4: 0,+2,-8,-6,-14,-12,-20 -->
  <polyline points="80,137 145,111 209,241 274,215 338,319 403,293 467,397" fill="none" stroke="#BA7517" stroke-width="2"/>
  <circle cx="80" cy="137" r="3" fill="#BA7517"/><circle cx="145" cy="111" r="3" fill="#BA7517"/><circle cx="209" cy="241" r="3" fill="#BA7517"/><circle cx="274" cy="215" r="3" fill="#BA7517"/><circle cx="338" cy="319" r="3" fill="#BA7517"/><circle cx="403" cy="293" r="3" fill="#BA7517"/><circle cx="467" cy="397" r="3" fill="#BA7517"/>
  
  <!-- E4: 0,-3,-4,-6,-10,-8,-14,-12 -->
  <polyline points="80,137 145,176 209,189 274,215 338,267 403,241 467,319 532,293" fill="none" stroke="#1D9E75" stroke-width="2"/>
  <circle cx="80" cy="137" r="3" fill="#1D9E75"/><circle cx="145" cy="176" r="3" fill="#1D9E75"/><circle cx="209" cy="189" r="3" fill="#1D9E75"/><circle cx="274" cy="215" r="3" fill="#1D9E75"/><circle cx="338" cy="267" r="3" fill="#1D9E75"/><circle cx="403" cy="241" r="3" fill="#1D9E75"/><circle cx="467" cy="319" r="3" fill="#1D9E75"/><circle cx="532" cy="293" r="3" fill="#1D9E75"/>
  
  <!-- F5: 0,-6,-10,-14,-18 -->
  <polyline points="80,137 145,215 209,267 274,319 338,371" fill="none" stroke="#378ADD" stroke-width="2"/>
  <circle cx="80" cy="137" r="3" fill="#378ADD"/><circle cx="145" cy="215" r="3" fill="#378ADD"/><circle cx="209" cy="267" r="3" fill="#378ADD"/><circle cx="274" cy="319" r="3" fill="#378ADD"/><circle cx="338" cy="371" r="3" fill="#378ADD"/>
  
  <!-- C6: 0,-16,-20 -->
  <polyline points="80,137 145,345 209,397" fill="none" stroke="#7F77DD" stroke-width="2"/>
  <circle cx="80" cy="137" r="3" fill="#7F77DD"/><circle cx="145" cy="345" r="3" fill="#7F77DD"/><circle cx="209" cy="397" r="3" fill="#7F77DD"/>
  
  <!-- Legend -->
  <rect x="100" y="42" width="10" height="10" fill="#E24B4A" rx="2"/>
  <text x="115" y="51" font-size="11" fill="#666">F3 (177Hz)</text>
  <rect x="200" y="42" width="10" height="10" fill="#BA7517" rx="2"/>
  <text x="215" y="51" font-size="11" fill="#666">C4 (262Hz)</text>
  <rect x="300" y="42" width="10" height="10" fill="#1D9E75" rx="2"/>
  <text x="315" y="51" font-size="11" fill="#666">E4 (330Hz)</text>
  <rect x="400" y="42" width="10" height="10" fill="#378ADD" rx="2"/>
  <text x="415" y="51" font-size="11" fill="#666">F5 (699Hz)</text>
  <rect x="500" y="42" width="10" height="10" fill="#7F77DD" rx="2"/>
  <text x="515" y="51" font-size="11" fill="#666">C6 (1042Hz)</text>
</svg>
